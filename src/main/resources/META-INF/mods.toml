[[mods]]
modId="terraplusplus"
version="${file.jarVersion}"
displayName="Terra++"
displayURL="https://github.com/BuildTheEarth/terraplusplus"
authors="BuildTheEarth Team"
description='''
Real-world terrain data for Minecraft.
Provides Earth heightmaps, projections, and terrain sampling.
This build embeds TerraCubes/CubicWorldGen code into the same jar.
'''

[[mods]]
modId="terracubes"
version="${file.jarVersion}"
displayName="TerraCubes Embedded"
authors="Gamer2735, based on OpenCubicChunks"
description='''
Embedded cubic chunk support merged into the Terra++ jar.
'''

[[mods]]
modId="cubicworldgen"
version="${file.jarVersion}"
displayName="Cubic World Gen Embedded"
authors="OpenCubicChunks Team"
description='''
Embedded cube-aware world generation support merged into the Terra++ jar.
'''


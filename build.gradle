plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '2.0.0-alpha'
group = 'net.buildtheearth'
archivesBaseName = 'terraplusplus'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ✅ Enable JarJar
jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                terraplusplus {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                terraplusplus {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "cubicchunks.refmap.json"
    add sourceSets.main, "cubicworldgen.refmap.json"
    config "cubicchunks.mixins.json"
    config "cubicworldgen.mixins.json"
    // LOADING-SCREEN FIX (run 16): MixinSpawnPrep was written two
    // sessions ago but this config was never registered — the
    // mixin silently never applied (27s spawn prep unchanged).
    //
    // CRASH FIX (run 17): do NOT `add` a third refmap here! The
    // mixin plugin keeps ONE refmap per source set — the last
    // `add` wins. Adding terraplusplus.refmap.json stole the slot
    // from cubicworldgen.refmap.json, so the rebuild stopped
    // generating it and CubicWorldGen's buildSurface injection
    // crashed the boot ("No refMap loaded"). terraplusplus.mixins
    // instead SHARES cubicworldgen.refmap.json via its own
    // "refmap" key; MixinSpawnPrep also lists SRG names directly
    // and is require=0, so it needs no remapping at all.
    config "terraplusplus.mixins.json"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven' }
    maven {
        name = 'DaPorkchop'
        url = 'https://maven.daporkchop.net/'
    }
    maven {
        name = 'DaPorkchop Release'
        url = 'https://maven.daporkchop.net/release/'
    }
    maven {
        name = 'DaPorkchop Snapshot'
        url = 'https://maven.daporkchop.net/snapshot/'
    }
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Lombok — must come FIRST
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Everything else stays the same...
    compileOnly 'io.netty:netty-all:4.1.97.Final'
    compileOnly 'org.jetbrains:annotations:24.0.1'

    minecraftLibrary 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    minecraftLibrary 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    minecraftLibrary 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'

    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-core',
           version: '[2.15.0,2.16.0)') {
        jarJar.pin(it, '2.15.2')
    }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-databind',
           version: '[2.15.0,2.16.0)') {
        jarJar.pin(it, '2.15.2')
    }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations',
           version: '[2.15.0,2.16.0)') {
        jarJar.pin(it, '2.15.2')
    }

    minecraftLibrary('net.daporkchop.lib:common:0.5.7-SNAPSHOT') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    minecraftLibrary('net.daporkchop.lib:binary:0.5.7-SNAPSHOT') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }

    jarJar(group: 'net.daporkchop.lib', name: 'common',
           version: '[0.5.7,0.6.0)') {
        jarJar.pin(it, '0.5.7-SNAPSHOT')
    }
    jarJar(group: 'net.daporkchop.lib', name: 'binary',
           version: '[0.5.7,0.6.0)') {
        jarJar.pin(it, '0.5.7-SNAPSHOT')
    }

    minecraftLibrary('com.squareup.okhttp3:okhttp:4.12.0') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    minecraftLibrary('com.squareup.okio:okio:3.6.0') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    minecraftLibrary('com.squareup.okio:okio-jvm:3.6.0') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    minecraftLibrary('org.jetbrains.kotlin:kotlin-stdlib:1.9.10') {
        exclude group: 'org.jetbrains', module: 'annotations'
    }

    jarJar(group: 'com.squareup.okhttp3', name: 'okhttp',
           version: '[4.12.0,4.13.0)') {
        jarJar.pin(it, '4.12.0')
    }
    jarJar(group: 'com.squareup.okio', name: 'okio-jvm',
           version: '[3.6.0,3.7.0)') {
        jarJar.pin(it, '3.6.0')
    }
    jarJar(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib',
           version: '[1.9.0,1.10.0)') {
        jarJar.pin(it, '1.9.10')
    }

    minecraftLibrary 'org.apache.commons:commons-imaging:1.0.0-alpha5'

    jarJar(group: 'org.apache.commons', name: 'commons-imaging',
           version: '[1.0.0-alpha5,1.1.0)') {
        jarJar.pin(it, '1.0.0-alpha5')
    }

    // WebP decoding for Mapterhorn elevation tiles (Terrarium-encoded
    // WebP inside PMTiles archives). TwelveMonkeys registers its
    // readers with ImageIO automatically via SPI.
    minecraftLibrary 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    minecraftLibrary 'com.twelvemonkeys.imageio:imageio-core:3.15.3'
    minecraftLibrary 'com.twelvemonkeys.imageio:imageio-metadata:3.15.3'
    minecraftLibrary 'com.twelvemonkeys.common:common-lang:3.15.3'
    minecraftLibrary 'com.twelvemonkeys.common:common-io:3.15.3'
    minecraftLibrary 'com.twelvemonkeys.common:common-image:3.15.3'

    jarJar(group: 'com.twelvemonkeys.imageio', name: 'imageio-webp',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }
    jarJar(group: 'com.twelvemonkeys.imageio', name: 'imageio-core',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }
    jarJar(group: 'com.twelvemonkeys.imageio', name: 'imageio-metadata',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }
    jarJar(group: 'com.twelvemonkeys.common', name: 'common-lang',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }
    jarJar(group: 'com.twelvemonkeys.common', name: 'common-io',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }
    jarJar(group: 'com.twelvemonkeys.common', name: 'common-image',
           version: '[3.15.0,3.16.0)') {
        jarJar.pin(it, '3.15.3')
    }

    // VIDA Ultimate Dependencies (GIS Exclusions to prevent JAI/GeoTools build failures)
    implementation('org.wololo:flatgeobuf:3.26.2') {
        exclude group: 'org.geotools'
        exclude group: 'javax.media'
        exclude group: 'org.ejml'
    }
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    implementation 'com.google.flatbuffers:flatbuffers-java:2.0.3'
    // PackedRTree.search touches Guava's LittleEndianDataInputStream.
    // Minecraft already ships guava 31.1-jre, so compileOnly is enough and we
    // must NOT jarJar it (that would shade a second copy into the classpath).
    compileOnly 'com.google.guava:guava:31.1-jre'

    jarJar(group: 'org.wololo', name: 'flatgeobuf', version: '[3.26.0,4.0.0)') {
        jarJar.pin(it, '3.26.2')
    }
    jarJar(group: 'org.locationtech.jts', name: 'jts-core', version: '[1.19.0,1.20.0)') {
        jarJar.pin(it, '1.19.0')
    }
    jarJar(group: 'com.google.flatbuffers', name: 'flatbuffers-java', version: '[2.0.0,3.0.0)') {
        jarJar.pin(it, '2.0.3')
    }

    implementation 'com.google.code.gson:gson:2.10.1'
}

// ✅ Make the default jar task produce the jarJar output
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'    // plain jar without deps
    manifest {
        attributes([
            "Specification-Title"     : "terraplusplus",
            "Specification-Vendor"    : "BuildTheEarth",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "BuildTheEarth",
            "MixinConfigs"            : "cubicchunks.mixins.json,cubicworldgen.mixins.json,terraplusplus.mixins.json"
        ])
    }
}

// ✅ The jarJar task produces the distributable JAR
tasks.named('jarJar', net.minecraftforge.gradle.userdev.tasks.JarJar).configure {
    archiveClassifier = ''        // this becomes the main artifact
}

// ✅ Build should produce the jarJar
tasks.named('build').configure {
    dependsOn 'jarJar'
}


// Force UTF-8 so Windows builds do not interpret Java comments as windows-1252.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

// Include generated refmaps in the final single jar when present.
processResources {
    from(tasks.compileJava) {
        include 'cubicchunks.refmap.json'
        include 'cubicworldgen.refmap.json'
    }
}
